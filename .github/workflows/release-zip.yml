name: build-plugin-zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build zip module
        run: |
          set -euo pipefail

          PLUGIN="ovebot-ai-chatbot-sales-agent"
          BUILD_DIR="$(mktemp -d)"
          mkdir -p "${BUILD_DIR}/${PLUGIN}"

          # Single source of truth for what must never ship: .distignore, the
          # same list the WordPress.org SVN deploy honors. rsync ignores blank
          # lines and #-comments in an --exclude-from file, so the annotated
          # .distignore can be fed to it verbatim instead of being mirrored by
          # hand here (which is how the two drifted apart before).
          rsync -a ./ "${BUILD_DIR}/${PLUGIN}/" --exclude-from='.distignore'

          (cd "${BUILD_DIR}" && zip -r "${GITHUB_WORKSPACE}/${PLUGIN}.zip" "${PLUGIN}")

      - name: Upload asset
        uses: softprops/action-gh-release@v1
        with:
          files: ovebot-ai-chatbot-sales-agent.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
